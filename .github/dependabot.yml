version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /BiliIndexTranslate.Desktop
    schedule:
      interval: weekly
    groups:
      test-tooling:
        patterns: ["Microsoft.NET.Test.Sdk", "xunit*"]