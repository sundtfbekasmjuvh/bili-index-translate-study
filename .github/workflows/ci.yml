name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension and sandbox (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Syntax check
        run: |
          for f in bili-index-translate/*.js bili-study-sandbox/*.js tests/extension/*.js tests/support/*.js tests/e2e/*.js tests/perf/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Validate extension JSON
        run: |
          node -e '
            const fs = require("fs");
            const dir = "bili-index-translate/";
            const manifest = JSON.parse(fs.readFileSync(dir + "manifest.json", "utf8"));
            if (manifest.manifest_version !== 3) throw new Error("manifest_version must be 3");
            const locales = fs.readdirSync(dir + "_locales");
            for (const locale of locales) JSON.parse(fs.readFileSync(dir + "_locales/" + locale + "/messages.json", "utf8"));
            console.log("manifest", manifest.version, "with locales", locales.join(", "));
          '

      - name: Unit tests
        run: node --test "tests/**/*.test.js"

  e2e:
    name: Extension end-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install test tooling
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: Desktop (.NET 10, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        working-directory: BiliIndexTranslate.Desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BiliIndexTranslate.sln

      # Known vulnerabilities in direct or transitive NuGet packages fail the build (advisories from nuget.org).
      - name: Check for vulnerable packages
        run: |
          $out = @(dotnet list BiliIndexTranslate.sln package --vulnerable --include-transitive 2>&1)
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "dotnet list package --vulnerable failed with exit code $LASTEXITCODE" }
          if ($out -match "has the following vulnerable packages") { throw "Vulnerable NuGet packages found (see the list above)" }

      - name: Build
        run: dotnet build BiliIndexTranslate.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/BiliIndexTranslate.Core.Tests/BiliIndexTranslate.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory TestResults/coverage

      - name: UI tests
        timeout-minutes: 20
        run: dotnet test tests/BiliIndexTranslate.App.UiTests/BiliIndexTranslate.App.UiTests.csproj -c Release --no-build --logger "trx;LogFileName=ui-tests.trx" --logger "console;verbosity=detailed" --results-directory TestResults

      # Baseline numbers (recorded only, no thresholds): job summary + artifact. Never fails the job.
      - name: Baseline summary
        if: always()
        shell: pwsh
        run: |
          $md = New-Object System.Collections.Generic.List[string]
          $md.Add("## Baseline numbers (recorded only, no thresholds)")
          $dir = "TestResults/baseline"
          function Read-Json($name) {
            $f = Join-Path $dir "$name.json"
            if (-not (Test-Path -LiteralPath $f)) { Write-Warning "$f is missing"; $md.Add(""); $md.Add("_$name.json is missing (test did not finish)_"); return $null }
            try { return Get-Content -LiteralPath $f -Raw | ConvertFrom-Json } catch { Write-Warning "$f is unreadable: $_"; $md.Add(""); $md.Add("_$name.json is unreadable_"); return $null }
          }
          function Ms($v) { if ($null -eq $v) { "n/a" } else { "{0:N0}" -f $v } }

          $lat = Read-Json "latency"
          if ($lat) {
            $m = $lat.metrics
            $md.Add(""); $md.Add("### Latency: Ctrl+A to card (ms)")
            $md.Add("| Metric | ms |"); $md.Add("|---|---|")
            $md.Add("| miss: first card visible | $(Ms $m.missFirstCardVisibleMs) |")
            $md.Add("| miss: first partial text | $(Ms $m.missFirstPartialTextMs) |")
            $md.Add("| miss: final text | $(Ms $m.missFinalTextMs) |")
            $md.Add("| hit min / median / max (n=$($m.hitCount)) | $(Ms $m.hitMinMs) / $(Ms $m.hitMedianMs) / $(Ms $m.hitMaxMs) |")
            $md.Add(""); $md.Add("_Trigger is the UIA selection event; the mock's segment delay dominates the final time on a miss._")
          }

          $cold = Read-Json "cold-start"
          if ($cold) {
            $md.Add(""); $md.Add("### Cold start (ms)")
            $md.Add("| Run | Process.Start to ready (poll 200 ms) | App log first line to ready |"); $md.Add("|---|---|---|")
            foreach ($r in @($cold.metrics.runs)) { $md.Add("| $($r.run) | $(Ms $r.startupMs) | $(Ms $r.appLogFirstLineToReadyMs) |") }
            $md.Add("| min / median / max | $(Ms $cold.metrics.startupMinMs) / $(Ms $cold.metrics.startupMedianMs) / $(Ms $cold.metrics.startupMaxMs) | |")
          }

          $res = Read-Json "resources"
          if ($res) {
            $md.Add(""); $md.Add("### Resources over $($res.metrics.cycles) selections")
            $md.Add("| Cycle | Handles | GDI | USER | Private MB | Working set MB |"); $md.Add("|---|---|---|---|---|---|")
            foreach ($s in @($res.metrics.samples)) {
              $md.Add(("| {0} | {1} | {2} | {3} | {4:N1} | {5:N1} |" -f $s.Cycle, $s.Handles, $s.Gdi, $s.User, ($s.PrivateBytes / 1MB), ($s.WorkingSet / 1MB)))
            }
            $d = $res.metrics.delta
            $md.Add(("| **delta** | {0} | {1} | {2} | {3:N1} | {4:N1} |" -f $d.handles, $d.gdiObjects, $d.userObjects, ($d.privateBytes / 1MB), ($d.workingSetBytes / 1MB)))
          }

          # App matrix: one app-matrix-<app>.json per app (warn only, never fails the step)
          $matrixFiles = @(Get-ChildItem -Path $dir -Filter "app-matrix-*.json" -ErrorAction SilentlyContinue | Sort-Object Name)
          if ($matrixFiles.Count -eq 0) {
            Write-Warning "no app-matrix-*.json under $dir"
          } else {
            $order = @("double-click", "triple-click", "drag", "keyboard", "cold-triple-click")
            $rows = @(); $details = @()
            foreach ($f in $matrixFiles) {
              try {
                $m = Get-Content -LiteralPath $f.FullName -Raw | ConvertFrom-Json
                $cells = foreach ($g in $order) {
                  $e = @($m.entries) | Where-Object { $_.gesture -eq $g } | Select-Object -First 1
                  if ($null -eq $e) { "-" } elseif ($e.result -eq "pass") { "pass ($(Ms $e.timeToCardMs) ms)" } elseif ($e.result -eq "n/a") { "n/a" } else { "FAIL" }
                }
                # First selection: the warm-up selection of each gesture's session (informational), as passed/total
                $warm = @(@($m.entries) | Where-Object { $null -ne $_.firstSelection })
                $warmOk = @($warm | Where-Object { $_.firstSelection.passed }).Count
                $firstCell = if ($warm.Count -eq 0) { "-" } else { "$warmOk/$($warm.Count) ok" }
                $rows += "| $($m.displayName) | $($cells -join ' | ') | $firstCell |"
                foreach ($e in @($m.entries)) {
                  $sel = "$($e.selectedText)" -replace "[\r\n]+", " " -replace "\|", "\|"
                  if ($sel.Length -gt 90) { $sel = $sel.Substring(0, 90) + "..." }
                  $err = "$($e.error)" -replace "[\r\n]+", " " -replace "\|", "\|"
                  if ($err.Length -gt 120) { $err = $err.Substring(0, 120) + "..." }
                  $res = if ($e.result -eq "pass") { "pass" } elseif ($e.result -eq "n/a") { "n/a" } else { "FAIL" }
                  $fs = if ($null -eq $e.firstSelection) { "-" } elseif ($e.firstSelection.passed) { "ok ($(Ms $e.firstSelection.timeMs) ms)" } else { "failed" }
                  $details += "| $($m.displayName) | $($e.gesture) | $res | $fs | $sel | $err |"
                }
              } catch { Write-Warning "$($f.Name) is unreadable: $_"; $rows += "| $($f.Name) | unreadable | | | | | |" }
            }
            $md.Add(""); $md.Add("### App matrix (selection gestures that produced the card)")
            $md.Add("| App | double-click | triple-click | drag | keyboard | cold triple-click | first selection |"); $md.Add("|---|---|---|---|---|---|---|")
            foreach ($r in $rows) { $md.Add($r) }
            $md.Add(""); $md.Add("| App | Gesture | Result | First selection | Selected text sent | Error |"); $md.Add("|---|---|---|---|---|---|")
            foreach ($d in $details) { $md.Add($d) }
            $md.Add(""); $md.Add("_Time is from the end of the gesture to the full card text and includes the mock's three streamed segments (about 0.8 s). First selection = the warm-up selection (a separate line) made before each measured gesture in a freshly started program; informational, not asserted. n/a = the gesture does not exist in that program. A dash means the test did not run (program missing) or did not finish._")
          }

          $env1 = if ($lat) { $lat.environment } elseif ($cold) { $cold.environment } elseif ($res) { $res.environment } else { $null }
          if ($env1) { $md.Add(""); $md.Add("_Runner: $($env1.os), $($env1.processorCount) logical processors_") }

          $md.Add(""); $md.Add("### Core unit-test coverage (cobertura)")
          $cov = @(Get-ChildItem -Path "TestResults/coverage" -Recurse -Filter "coverage.cobertura.xml" -ErrorAction SilentlyContinue)
          if ($cov.Count -eq 0) {
            Write-Warning "no coverage.cobertura.xml under TestResults/coverage"
            $md.Add("_no cobertura file found_")
          } else {
            $md.Add("| File | Line rate | Branch rate |"); $md.Add("|---|---|---|")
            foreach ($c in $cov) {
              try {
                $x = [xml](Get-Content -LiteralPath $c.FullName -Raw)
                $md.Add(("| {0} | {1:P1} | {2:P1} |" -f $c.Directory.Name, [double]::Parse($x.coverage.'line-rate', [Globalization.CultureInfo]::InvariantCulture), [double]::Parse($x.coverage.'branch-rate', [Globalization.CultureInfo]::InvariantCulture)))
              } catch { Write-Warning "$($c.FullName) is unreadable: $_"; $md.Add("| $($c.Directory.Name) | unreadable | |") }
            }
          }

          $text = $md -join "`n"
          Write-Host $text
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $text -Encoding utf8 }
          exit 0

      - name: Upload baseline numbers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline
          path: |
            BiliIndexTranslate.Desktop/TestResults/baseline/
            BiliIndexTranslate.Desktop/TestResults/coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload UI test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: |
            BiliIndexTranslate.Desktop/TestResults/ui-screenshots/
            BiliIndexTranslate.Desktop/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Package release assets (dry run)
        run: ../.github/scripts/package-release.ps1 -OutDir "$env:RUNNER_TEMP/dist"

      # Builds the installer and the update packages exactly as the release workflow does, without uploading anything.
      - name: Velopack pack (dry run)
        run: |
          $version = (Select-Xml -LiteralPath Directory.Build.props -XPath "//Version").Node.InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Directory.Build.props Version '$version' is not MAJOR.MINOR.PATCH" }
          $publish = Join-Path $env:RUNNER_TEMP "velopack-publish"
          $out = Join-Path $env:RUNNER_TEMP "velopack-out"

          dotnet tool install -g vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install vpk failed with exit code $LASTEXITCODE" }

          dotnet publish src/BiliIndexTranslate.App/BiliIndexTranslate.App.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          foreach ($f in "LICENSE", "NOTICE") { if (-not (Test-Path -LiteralPath (Join-Path $publish $f))) { throw "dotnet publish put no $f next to the exe" } }

          vpk pack --packId BiliIndexTranslate.Desktop --packVersion $version --packDir $publish --mainExe BiliIndexTranslate.exe --packTitle "Bili Index Translate" --icon src/BiliIndexTranslate.App/Assets/app.ico --runtime win-x64 --channel win --noPortable --outputDir $out
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed with exit code $LASTEXITCODE" }

          if (-not (Test-Path (Join-Path $out "*-Setup.exe"))) { throw "vpk produced no Setup.exe in $out" }
          if (-not (Test-Path (Join-Path $out "BiliIndexTranslate.Desktop-$version-full.nupkg"))) { throw "vpk produced no full package for $version in $out" }
          # The installed app carries the license too.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = [IO.Compression.ZipFile]::OpenRead((Join-Path $out "BiliIndexTranslate.Desktop-$version-full.nupkg"))
          try {
            foreach ($f in "LICENSE", "NOTICE") { if (-not ($nupkg.Entries | Where-Object { $_.FullName -like "*/$f" })) { throw "the full package has no $f" } }
          } finally { $nupkg.Dispose() }
          Get-ChildItem -LiteralPath $out -File | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
